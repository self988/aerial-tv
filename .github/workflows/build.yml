name: Build and Release Aerial APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard & Guard Release APKs
        run: ./gradlew assembleStandardRelease assembleGuardRelease --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/standard/release/*.apk release-apks/aerial-standard.apk
          cp app/build/outputs/apk/guard/release/*.apk release-apks/aerial-guard.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0-custom --yes || true
          git tag -f v2.0-custom
          git push -f origin v2.0-custom || true
          gh release create v2.0-custom release-apks/*.apk --title "Aerial 2.0 Custom" --notes "Custom Aerial 2.0 build with Russian captions, Sleep Timer, 7-day Weather, VPN toggle, and Redmi X 2022 profile."
