name: Build Aerial APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard & Guard Release APKs
        run: ./gradlew assembleStandardRelease assembleGuardRelease --no-daemon

      - name: Upload Ready APKs
        uses: actions/upload-artifact@v4
        with:
          name: aerial-custom-tv-2.0
          path: app/build/outputs/apk/*/release/*.apk
